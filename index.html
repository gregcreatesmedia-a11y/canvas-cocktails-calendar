<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Canvas & Cocktails Events</title>

  <style>
    :root {
      --purple: #7447a8;
      --pink: #d84c9a;
      --teal: #16acc7;
      --black: #111111;
      --dark: #171717;
      --line: #dddddd;
      --text: #161616;
      --muted: #6f6f6f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 22px 18px 40px;
    }

    .calendar-wrap {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .section-title .line {
      height: 2px;
      flex: 1;
      background: linear-gradient(
        90deg,
        var(--purple),
        var(--pink),
        var(--teal)
      );
    }

    .section-title h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.14em;
      white-space: nowrap;
    }

    .month-nav {
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .month-nav button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 6px;
      color: #ffffff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #prevMonth,
#nextMonth {
  background: linear-gradient(
    135deg,
    var(--purple),
    var(--pink),
    var(--teal)
  );
}

    .month-nav h2 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--dark);
      border-left: 1px solid #343434;
      border-top: 1px solid #343434;
    }

    .weekday-row div {
      padding: 12px 4px;
      text-align: center;
      color: #dddddd;
      font-size: 11px;
      font-weight: 800;
      border-right: 1px solid #343434;
      border-bottom: 1px solid #343434;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-left: 1px solid #3a3a3a;
    }

    .day-cell {
      position: relative;
      min-width: 0;
      height: 180px;
      overflow: hidden;
      background: #0c0c0c;
      border-right: 1px solid #3a3a3a;
      border-bottom: 1px solid #3a3a3a;
    }

    .day-cell.empty {
      background: #181818;
    }

    .day-number {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 30;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-size: 11px;
      font-weight: 800;
    }

    .day-cell.today {
      box-shadow: inset 0 0 0 3px var(--pink);
    }

    .event-card {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      background: #111111;
      color: #ffffff;
      cursor: pointer;
    }

    .event-card img {
      width: 100%;
      height: 128px;
      display: block;
      object-fit: cover;
    }

    .event-copy {
      padding: 8px 9px;
      background: #111111;
      min-height: 52px;
    }

    .event-copy strong {
      display: block;
      font-size: 11px;
      line-height: 1.2;
      color: #ffffff;
    }

    .event-copy small {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: #bdbdbd;
    }

    .more-events-button {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 40;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .mobile-list {
      display: none;
    }

    .mobile-card {
      cursor: pointer;
    }

    .no-events {
      padding: 24px 16px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      text-align: center;
      color: #666666;
      background: #fafafa;
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.76);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .overview-modal {
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
    }

    .overview-image-wrap {
      position: relative;
      width: 100%;
      background: #111111;
    }

    .overview-image {
      width: 100%;
      max-height: 420px;
      display: block;
      object-fit: cover;
    }

    .overview-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
    }

    .overview-content {
      padding: 20px;
    }

    .overview-title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.15;
      color: #111111;
    }

    .overview-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 15px;
      color: #666666;
      font-size: 12px;
      font-weight: 700;
    }

    .overview-description {
      margin: 0 0 18px;
      color: #333333;
      font-size: 14px;
      line-height: 1.55;
    }

    .overview-subtitle {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #111111;
    }

    .overview-includes {
      margin: 0 0 18px;
      padding-left: 20px;
      color: #333333;
      font-size: 13px;
      line-height: 1.6;
    }

    .overview-age {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 10px;
      border-radius: 5px;
      background: #f1f1f1;
      color: #333333;
      font-size: 11px;
      font-weight: 800;
    }

    .overview-ticket {
      display: flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: linear-gradient(
        90deg,
        var(--purple),
        var(--pink),
        var(--teal)
      );
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .day-events-modal {
      width: 100%;
      max-width: 520px;
      max-height: 82vh;
      overflow-y: auto;
      border-radius: 12px;
      background: #ffffff;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }

    .day-events-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .day-events-top h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      color: #111111;
    }

    .day-events-close {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
    }

    .day-event-item {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid #dddddd;
      cursor: pointer;
    }

    .day-event-item:first-child {
      border-top: 0;
    }

    .day-event-item img {
      width: 78px;
      height: 94px;
      object-fit: cover;
      border-radius: 6px;
    }

    .day-event-item strong {
      display: block;
      margin-bottom: 4px;
      color: #111111;
      font-size: 13px;
      line-height: 1.25;
    }

    .day-event-item small {
      color: #666666;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      body {
        padding: 14px 12px 28px;
      }

      .section-title {
        gap: 8px;
        margin-bottom: 22px;
      }

      .section-title h1 {
        font-size: 12px;
        letter-spacing: 0.1em;
      }

      .month-nav {
        grid-template-columns: 42px 1fr 42px;
        gap: 8px;
        margin-bottom: 18px;
      }

      .month-nav button {
        width: 40px;
        height: 40px;
        font-size: 27px;
      }

      .month-nav h2 {
        font-size: 17px;
      }

      .desktop-calendar {
        display: none;
      }

      .mobile-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .mobile-card {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
        min-height: 104px;
        overflow: hidden;
        border: 1px solid #dddddd;
        border-radius: 11px;
        background:
          radial-gradient(
            circle at 94% 10%,
            rgba(216, 76, 154, 0.16),
            transparent 34%
          ),
          radial-gradient(
            circle at 82% 110%,
            rgba(22, 172, 199, 0.14),
            transparent 40%
          ),
          radial-gradient(
            circle at 35% -20%,
            rgba(116, 71, 168, 0.09),
            transparent 35%
          ),
          #ffffff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      }

      .mobile-date {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        background: linear-gradient(
          155deg,
          var(--purple),
          var(--pink) 60%,
          var(--teal) 130%
        );
      }

      .mobile-date span {
        margin-bottom: 5px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }

      .mobile-date strong {
        font-size: 28px;
        line-height: 1;
      }

      .mobile-info {
        padding: 12px 13px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }

      .mobile-title {
        margin-bottom: 4px;
        font-size: 13px;
        line-height: 1.25;
        font-weight: 800;
      }

      .mobile-time {
        margin-bottom: 7px;
        font-size: 11px;
        color: #666666;
      }

      .mobile-details {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: var(--purple);
      }

      .modal-backdrop {
        padding: 10px;
        align-items: center;
      }

      .overview-modal {
        max-height: 92vh;
      }

      .overview-image {
        max-height: 330px;
      }

      .overview-content {
        padding: 17px;
      }

      .overview-title {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="calendar-wrap">

    <div class="section-title">
      <div class="line"></div>
      <h1>UPCOMING EVENTS</h1>
      <div class="line"></div>
    </div>

    <div class="month-nav">
      <button id="prevMonth" type="button" aria-label="Previous month">‹</button>
      <h2 id="monthTitle"></h2>
      <button id="nextMonth" type="button" aria-label="Next month">›</button>
    </div>

    <div class="desktop-calendar">
      <div class="weekday-row">
        <div>SUN</div>
        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
        <div>SAT</div>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <div id="mobileList" class="mobile-list"></div>

  </div>

  <!-- EVENT OVERVIEW POPUP -->
  <div id="overviewBackdrop" class="modal-backdrop">
    <div class="overview-modal">

      <div class="overview-image-wrap">
        <img id="overviewImage" class="overview-image" src="" alt="">
        <button id="overviewClose" class="overview-close" type="button">×</button>
      </div>

      <div class="overview-content">
        <h2 id="overviewTitle" class="overview-title"></h2>

        <div class="overview-meta">
          <span id="overviewDate"></span>
          <span id="overviewTime"></span>
        </div>

        <p id="overviewDescription" class="overview-description"></p>

        <div id="overviewIncludesWrap">
          <h3 class="overview-subtitle">WHAT'S INCLUDED</h3>
          <ul id="overviewIncludes" class="overview-includes"></ul>
        </div>

        <div>
          <span id="overviewAge" class="overview-age"></span>
        </div>

        <a
          id="overviewTicket"
          class="overview-ticket"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          GET TICKETS
        </a>
      </div>

    </div>
  </div>

  <!-- MULTIPLE EVENTS ON SAME DAY POPUP -->
  <div id="dayEventsBackdrop" class="modal-backdrop">
    <div class="day-events-modal">

      <div class="day-events-top">
        <h3 id="dayEventsTitle"></h3>
        <button
          id="dayEventsClose"
          class="day-events-close"
          type="button"
        >
          ×
        </button>
      </div>

      <div id="dayEventsList"></div>

    </div>
  </div>

  <script>
    /*
      ==================================================
      EDIT YOUR EVENTS HERE
      ==================================================

      You can add:
      date
      title
      time
      image
      description
      includes
      age
      link

      Multiple events can use the SAME date.
    */

    const events = [

      {
        date: "2026-09-11",
        title: "Friday Night Paint & Sip",
        time: "7:00 PM",
        image: "https://placehold.co/600x800/202020/FFFFFF?text=FRIDAY+PAINT+%26+SIP",
        description:
          "Kick off your weekend with painting, cocktails, music, and good energy at Canvas & Cocktails.",
        includes: [
          "Guided painting experience",
          "Canvas and painting supplies",
          "Music throughout the event",
          "Full bar available"
        ],
        age: "21+ Event",
        link: "https://www.eventbrite.com/"
      },

      {
        date: "2026-09-18",
        title: "R&B Paint & Sip",
        time: "6:00 PM",
        image: "https://placehold.co/600x800/7447A8/FFFFFF?text=R%26B+PAINT+%26+SIP",
        description:
          "Paint, sip, and vibe to R&B favorites while creating your own piece at Canvas & Cocktails.",
        includes: [
          "Guided painting experience",
          "Canvas and painting supplies",
          "R&B music",
          "Full bar available"
        ],
        age: "21+ Event",
        link: "https://www.eventbrite.com/"
      },

      {
        date: "2026-09-18",
        title: "Comedy Paint & Sip",
        time: "8:00 PM",
        image: "https://placehold.co/600x800/D84C9A/FFFFFF?text=COMEDY+PAINT+%26+SIP",
        description:
          "A paint and sip experience mixed with comedy, cocktails, and a fun night out with your crew.",
        includes: [
          "Painting experience",
          "Canvas and painting supplies",
          "Comedy entertainment",
          "Full bar available"
        ],
        age: "21+ Event",
        link: "https://www.eventbrite.com/"
      },

      {
        date: "2026-09-18",
        title: "Late Night Open Paint",
        time: "10:00 PM",
        image: "https://placehold.co/600x800/16ACC7/FFFFFF?text=LATE+NIGHT+OPEN+PAINT",
        description:
          "Come through for a relaxed late-night painting session with music, drinks, and room to create at your own pace.",
        includes: [
          "Canvas and painting supplies",
          "Open painting session",
          "Music",
          "Full bar available"
        ],
        age: "21+ Event",
        link: "https://www.eventbrite.com/"
      }

    ];

    const monthNames = [
      "JANUARY",
      "FEBRUARY",
      "MARCH",
      "APRIL",
      "MAY",
      "JUNE",
      "JULY",
      "AUGUST",
      "SEPTEMBER",
      "OCTOBER",
      "NOVEMBER",
      "DECEMBER"
    ];

    const weekdayNames = [
      "SUN",
      "MON",
      "TUE",
      "WED",
      "THU",
      "FRI",
      "SAT"
    ];

    const calendarGrid = document.getElementById("calendarGrid");
    const mobileList = document.getElementById("mobileList");
    const monthTitle = document.getElementById("monthTitle");
    const prevMonth = document.getElementById("prevMonth");
    const nextMonth = document.getElementById("nextMonth");

    const overviewBackdrop = document.getElementById("overviewBackdrop");
    const overviewClose = document.getElementById("overviewClose");
    const overviewImage = document.getElementById("overviewImage");
    const overviewTitle = document.getElementById("overviewTitle");
    const overviewDate = document.getElementById("overviewDate");
    const overviewTime = document.getElementById("overviewTime");
    const overviewDescription = document.getElementById("overviewDescription");
    const overviewIncludes = document.getElementById("overviewIncludes");
    const overviewIncludesWrap = document.getElementById("overviewIncludesWrap");
    const overviewAge = document.getElementById("overviewAge");
    const overviewTicket = document.getElementById("overviewTicket");

    const dayEventsBackdrop = document.getElementById("dayEventsBackdrop");
    const dayEventsClose = document.getElementById("dayEventsClose");
    const dayEventsTitle = document.getElementById("dayEventsTitle");
    const dayEventsList = document.getElementById("dayEventsList");

    const today = new Date();

    let displayYear = today.getFullYear();
    let displayMonth = today.getMonth();

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function makeDateKey(year, month, day) {
      return `${year}-${pad(month + 1)}-${pad(day)}`;
    }

    function formatEventDate(dateString) {
      const parts = dateString.split("-").map(Number);

      const date = new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
      );

      return date.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
    }

    function getEventsForDate(year, month, day) {
      const key = makeDateKey(year, month, day);

      return events
        .filter(event => event.date === key)
        .sort((a, b) => a.time.localeCompare(b.time));
    }

    function openOverview(event) {

      overviewImage.src = event.image;
      overviewImage.alt = event.title;

      overviewTitle.textContent = event.title;
      overviewDate.textContent = formatEventDate(event.date);
      overviewTime.textContent = event.time;
      overviewDescription.textContent = event.description || "";

      overviewIncludes.innerHTML = "";

      if (event.includes && event.includes.length > 0) {
        overviewIncludesWrap.style.display = "block";

        event.includes.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item;
          overviewIncludes.appendChild(li);
        });
      } else {
        overviewIncludesWrap.style.display = "none";
      }

      if (event.age) {
        overviewAge.style.display = "inline-block";
        overviewAge.textContent = event.age;
      } else {
        overviewAge.style.display = "none";
      }

      overviewTicket.href = event.link;

      overviewBackdrop.classList.add("open");
    }

    function closeOverview() {
      overviewBackdrop.classList.remove("open");
    }

    function openDayEvents(year, month, day, dayEvents) {

      const date = new Date(year, month, day);

      dayEventsTitle.textContent =
        date.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });

      dayEventsList.innerHTML = "";

      dayEvents.forEach(event => {

        const item = document.createElement("div");
        item.className = "day-event-item";

        const image = document.createElement("img");
        image.src = event.image;
        image.alt = event.title;

        const info = document.createElement("div");

        const title = document.createElement("strong");
        title.textContent = event.title;

        const time = document.createElement("small");
        time.textContent = event.time;

        info.appendChild(title);
        info.appendChild(time);

        item.appendChild(image);
        item.appendChild(info);

        item.addEventListener("click", () => {
          dayEventsBackdrop.classList.remove("open");
          openOverview(event);
        });

        dayEventsList.appendChild(item);
      });

      dayEventsBackdrop.classList.add("open");
    }

    function closeDayEvents() {
      dayEventsBackdrop.classList.remove("open");
    }

    overviewClose.addEventListener("click", closeOverview);

    overviewBackdrop.addEventListener("click", event => {
      if (event.target === overviewBackdrop) {
        closeOverview();
      }
    });

    dayEventsClose.addEventListener("click", closeDayEvents);

    dayEventsBackdrop.addEventListener("click", event => {
      if (event.target === dayEventsBackdrop) {
        closeDayEvents();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeOverview();
        closeDayEvents();
      }
    });

    function renderDesktopCalendar() {

      calendarGrid.innerHTML = "";

      const firstWeekday =
        new Date(displayYear, displayMonth, 1).getDay();

      const daysInMonth =
        new Date(displayYear, displayMonth + 1, 0).getDate();

      const totalUsedCells = firstWeekday + daysInMonth;

      const totalCells =
        totalUsedCells <= 35 ? 35 : 42;

      for (
        let cellIndex = 0;
        cellIndex < totalCells;
        cellIndex++
      ) {

        const cell = document.createElement("div");
        cell.className = "day-cell";

        const day = cellIndex - firstWeekday + 1;

        if (day < 1 || day > daysInMonth) {
          cell.classList.add("empty");
          calendarGrid.appendChild(cell);
          continue;
        }

        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = day;

        cell.appendChild(number);

        if (
          displayYear === today.getFullYear() &&
          displayMonth === today.getMonth() &&
          day === today.getDate()
        ) {
          cell.classList.add("today");
        }

        const dayEvents =
          getEventsForDate(
            displayYear,
            displayMonth,
            day
          );

        if (dayEvents.length > 0) {

          const event = dayEvents[0];

          const card = document.createElement("div");
          card.className = "event-card";

          const image = document.createElement("img");
          image.src = event.image;
          image.alt = event.title;

          const copy = document.createElement("div");
          copy.className = "event-copy";

          const eventTitle =
            document.createElement("strong");

          eventTitle.textContent = event.title;

          const eventTime =
            document.createElement("small");

          eventTime.textContent = event.time;

          copy.appendChild(eventTitle);
          copy.appendChild(eventTime);

          card.appendChild(image);
          card.appendChild(copy);

          card.addEventListener("click", () => {
            openOverview(event);
          });

          cell.appendChild(card);

          if (dayEvents.length > 1) {

            const moreButton =
              document.createElement("button");

            moreButton.className =
              "more-events-button";

            moreButton.type = "button";

            moreButton.textContent =
              `+${dayEvents.length - 1} MORE`;

            moreButton.addEventListener(
              "click",
              eventClick => {
                eventClick.preventDefault();
                eventClick.stopPropagation();

                openDayEvents(
                  displayYear,
                  displayMonth,
                  day,
                  dayEvents
                );
              }
            );

            cell.appendChild(moreButton);
          }
        }

        calendarGrid.appendChild(cell);
      }
    }

    function renderMobileList() {

      mobileList.innerHTML = "";

      const monthEvents = events
        .filter(event => {

          const parts =
            event.date
              .split("-")
              .map(Number);

          const year = parts[0];
          const month = parts[1];

          return (
            year === displayYear &&
            month - 1 === displayMonth
          );

        })
        .sort((a, b) => {

          if (a.date !== b.date) {
            return a.date.localeCompare(b.date);
          }

          return a.time.localeCompare(b.time);

        });

      if (monthEvents.length === 0) {

        const emptyMessage =
          document.createElement("div");

        emptyMessage.className = "no-events";

        emptyMessage.textContent =
          "No events scheduled for this month.";

        mobileList.appendChild(emptyMessage);

        return;
      }

      monthEvents.forEach(event => {

        const parts =
          event.date
            .split("-")
            .map(Number);

        const year = parts[0];
        const month = parts[1];
        const day = parts[2];

        const eventDate =
          new Date(
            year,
            month - 1,
            day
          );

        const card =
          document.createElement("div");

        card.className = "mobile-card";

        const dateBlock =
          document.createElement("div");

        dateBlock.className = "mobile-date";

        const weekday =
          document.createElement("span");

        weekday.textContent =
          weekdayNames[
            eventDate.getDay()
          ];

        const dayNumber =
          document.createElement("strong");

        dayNumber.textContent = day;

        dateBlock.appendChild(weekday);
        dateBlock.appendChild(dayNumber);

        const info =
          document.createElement("div");

        info.className = "mobile-info";

        const title =
          document.createElement("div");

        title.className = "mobile-title";
        title.textContent = event.title;

        const time =
          document.createElement("div");

        time.className = "mobile-time";
        time.textContent = event.time;

        const details =
          document.createElement("div");

        details.className = "mobile-details";
        details.textContent = "VIEW DETAILS ›";

        info.appendChild(title);
        info.appendChild(time);
        info.appendChild(details);

        card.appendChild(dateBlock);
        card.appendChild(info);

        card.addEventListener("click", () => {
          openOverview(event);
        });

        mobileList.appendChild(card);

      });
    }

    function renderCalendar() {

      monthTitle.textContent =
        `${monthNames[displayMonth]} ${displayYear}`;

      renderDesktopCalendar();
      renderMobileList();

    }

    prevMonth.addEventListener("click", () => {

      displayMonth--;

      if (displayMonth < 0) {
        displayMonth = 11;
        displayYear--;
      }

      renderCalendar();
    });

    nextMonth.addEventListener("click", () => {

      displayMonth++;

      if (displayMonth > 11) {
        displayMonth = 0;
        displayYear++;
      }

      renderCalendar();
    });

    renderCalendar();

  </script>

</body>
</html>
